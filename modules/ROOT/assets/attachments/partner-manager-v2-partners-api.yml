          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of digital certificates
        '404':
          description: Partner not found
    post:
      summary: Create Partner Digital Certificate
      description: Uploads a new digital certificate for a trading partner. Supports X.509 certificates in PEM or DER format.
      operationId: post__organizations_organizationId_environments_environmentId_partners_partnerId_certificates
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                certificateBody:
                  type: string
                usage:
                  type: string
              required:
                - name
                - certificateBody
                - usage
      responses:
        '201':
          description: Certificate uploaded successfully
        '400':
          description: Bad request - invalid certificate data or format
  /organizations/{organizationId}/environments/{environmentId}/partners/{partnerId}/certificates/{certificateId}:
    get:
      summary: Get Partner Digital Certificate
      description: Retrieves details for a specific digital certificate associated with a trading partner.
      operationId: get__organizations_organizationId_environments_environmentId_partners_partnerId_certificates_certificateId_
      tags:
