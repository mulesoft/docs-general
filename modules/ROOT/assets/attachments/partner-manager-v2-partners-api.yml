          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of partner contacts. Returns array of contact objects with name, email, phone, role.
        '401':
          description: Unauthorized
        '404':
          description: Partner not found
    post:
      summary: Create Partner Contact
      description: Creates a new contact for a specific trading partner. Contacts represent individuals at the partner organization who are involved in B2B communication.
      operationId: post__organizations_organizationId_environments_environmentId_partners_partnerId_contacts
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                role:
                  type: string
              required:
                - name
                - email
                - phone
                - role
      responses:
        '201':
          description: Contact created successfully
        '400':
          description: Bad request - invalid contact data
        '401':
          description: Unauthorized
        '404':
          description: Partner not found
