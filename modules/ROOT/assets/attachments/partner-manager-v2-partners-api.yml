  /organizations/{organizationId}/environments/{environmentId}/partners/{partnerId}/certificates:
    get:
      summary: List Partner Digital Certificates
      description: Retrieves all digital certificates associated with a trading partner. Certificates are used for secure AS2 communication and message signing/encryption.
      operationId: get__organizations_organizationId_environments_environmentId_partners_partnerId_certificates
      tags:
