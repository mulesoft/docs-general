  /organizations/{organizationId}/environments/{environmentId}/partners/{partnerId}/endpoints:
    get:
      summary: List Partner Endpoints
      description: Retrieves all communication endpoints associated with a trading partner. Endpoints define the protocols and connection details for B2B message exchange (AS2, SFTP, HTTP/S, FTP).
      operationId: get__organizations_organizationId_environments_environmentId_partners_partnerId_endpoints
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of endpoints
        '404':
          description: Partner not found
    post:
      summary: Create Partner Endpoint
      description: Creates a new communication endpoint for a trading partner. Supports AS2, SFTP, HTTP/S, and FTP protocol types with protocol-specific configuration.
      operationId: post__organizations_organizationId_environments_environmentId_partners_partnerId_endpoints
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              name:
                type: string
                required: true
                description: Endpoint name
              type:
                type: string
                required: true
                description: 'Endpoint protocol type: ''AS2'', ''SFTP'', ''HTTPS'', ''HTTP'', ''FTP'''
              direction:
                type: string
                required: true
                description: 'Endpoint direction: ''send'' or ''receive'''
              config:
                type: object
                required: true
                description: Protocol-specific configuration (URL, host, port, credentials, etc.)
      responses:
        '201':
          description: Endpoint created successfully
        '400':
          description: Bad request - invalid endpoint configuration
