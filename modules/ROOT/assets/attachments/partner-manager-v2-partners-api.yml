        '404':
          description: Endpoint or partner not found
  /organizations/{organizationId}/environments/{environmentId}/partners/{partnerId}/messageFlows:
    get:
      summary: List Partner Message Flows
      description: Retrieves all message flows associated with a trading partner. Message flows define the routing, transformation, and processing rules for B2B transactions between partners.
      operationId: get__organizations_organizationId_environments_environmentId_partners_partnerId_messageFlows
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of message flows
        '404':
          description: Partner not found
    post:
      summary: Create Partner Message Flow
      description: Creates a new message flow for a trading partner. Message flows connect source and target endpoints with message type definitions and transformation rules.
      operationId: post__organizations_organizationId_environments_environmentId_partners_partnerId_messageFlows
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                direction:
                  type: string
