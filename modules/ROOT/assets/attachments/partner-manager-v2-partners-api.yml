openapi: 3.0.3
info:
  title: Partner Manager v2 Partners API
  description: |-
    The Partner Manager v2 Partners API enables access to trading partner details including partner names, descriptions, logos, addresses, contacts, and associated assets such as identifiers, digital certificates, endpoints, message types, and message flows. It provides comprehensive CRUD operations for managing B2B trading partner relationships, configurations, and transaction processing within the Anypoint Platform ecosystem.

    The Partner Manager v2 Partners API provides programmatic management of B2B trading partner relationships in Anypoint Platform. It allows organizations to create and manage trading partners, their contact information, identifiers (DUNS, AS2, X12), digital certificates, communication endpoints (AS2, SFTP, HTTP/S), message types, message flows, and deployment configurations. This API is essential for automating B2B integration workflows and partner onboarding processes.
  version: 1.0.x
  contact:
    name: MuleSoft
    url: https://www.mulesoft.com
servers:
  - url: https://anypoint.mulesoft.com/partnermanager/partners/api/v2
    description: Anypoint Platform
security:
  - bearerAuth: []
paths:
  /organizations/{organizationId}/environments/{environmentId}/partners:
    get:
      summary: List All Partners
      description: Retrieves a list of all trading partners configured in the specified organization and environment. Returns partner details including name, description, status, and summary of associated assets.
      operationId: get__organizations_organizationId_environments_environmentId_partners
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: Pagination offset
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
        - name: searchTerm
          in: query
          required: false
          description: Search filter for partner name
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of partners. Returns array of partner objects with id, name, description, status, and asset counts.
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden - insufficient permissions or no Partner Manager subscription
    post:
      summary: Create Partner
      description: Creates a new trading partner in the specified organization and environment. The partner is initialized with basic information and can subsequently have identifiers, certificates, endpoints, and message flows added.
      operationId: post__organizations_organizationId_environments_environmentId_partners
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              name:
                type: string
                required: true
                description: The name of the trading partner
              description:
                type: string
                required: false
                description: Description of the trading partner
              address:
                type: object
                required: false
                description: Physical address of the partner with street, city, state, country, postalCode
              websiteUrl:
                type: string
                required: false
                description: Partner's website URL
              logo:
                type: string
                required: false
                description: Base64 encoded logo image
      responses:
        '201':
          description: Partner created successfully. Returns the complete partner object with generated id.
        '400':
          description: Bad request - invalid partner data
        '401':
          description: Unauthorized - invalid or missing bearer token
        '403':
          description: Forbidden - insufficient permissions
        '409':
          description: Conflict - a partner with that name already exists
  /organizations/{organizationId}/environments/{environmentId}/partners/{partnerId}:
    get:
      summary: Get Partner Details
      description: Retrieves detailed information about a specific trading partner, including all configuration details, address, contacts summary, and asset counts.
      operationId: get__organizations_organizationId_environments_environmentId_partners_partnerId_
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved partner details.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Partner not found
    put:
      summary: Update Partner
      description: Updates an existing trading partner's information including name, description, address, and other profile details.
      operationId: put__organizations_organizationId_environments_environmentId_partners_partnerId_
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner to update
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              name:
                type: string
                description: Updated partner name
              description:
                type: string
                description: Updated description
              address:
                type: object
                description: Updated address
              websiteUrl:
                type: string
                description: Updated website URL
      responses:
        '200':
          description: Partner updated successfully
        '400':
          description: Bad request - invalid update data
        '401':
          description: Unauthorized
        '404':
          description: Partner not found
    delete:
      summary: Delete Partner
      description: Deletes a trading partner and all associated assets (identifiers, certificates, endpoints, message flows) from the specified environment.
      operationId: delete__organizations_organizationId_environments_environmentId_partners_partnerId_
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner to delete
          schema:
            type: string
      responses:
        '204':
          description: Partner deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Partner not found
        '409':
          description: Conflict - partner has active message flows and cannot be deleted
  /organizations/{organizationId}/environments/{environmentId}/partners/{partnerId}/contacts:
    get:
