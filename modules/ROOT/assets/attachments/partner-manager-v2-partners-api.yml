  /organizations/{organizationId}/environments/{environmentId}/partners/{partnerId}/identifiers:
    get:
      summary: List Partner Identifiers
      description: Retrieves all identifiers associated with a specific trading partner. Identifiers include DUNS numbers, AS2 IDs, X12 ISA and GS qualifiers, and other partner identification codes.
