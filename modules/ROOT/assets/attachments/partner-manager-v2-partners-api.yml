          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of identifiers
        '401':
          description: Unauthorized
        '404':
          description: Partner not found
    post:
      summary: Create Partner Identifier
      description: Creates a new identifier for a trading partner. Identifiers are used for partner lookup during B2B transaction processing.
      operationId: post__organizations_organizationId_environments_environmentId_partners_partnerId_identifiers
      tags:
        - Integration
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          description: The UUID of the organization
          schema:
            type: string
        - name: environmentId
          in: path
          required: true
          description: The UUID of the environment
          schema:
            type: string
        - name: partnerId
          in: path
          required: true
          description: The UUID of the trading partner
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                identifierTypeQualifierId:
                  type: string
                value:
                  type: string
              required:
                - identifierTypeQualifierId
                - value
      responses:
        '201':
          description: Identifier created successfully
        '400':
          description: Bad request - invalid identifier data
        '409':
          description: Conflict - identifier value already exists
  /organizations/{organizationId}/environments/{environmentId}/partners/{partnerId}/identifiers/{identifierId}:
    get:
      summary: Get Partner Identifier
