openapi: 3.0.3
info:
  title: Secrets Manager
  description: |-
    Secrets Manager API provides a secure way to upload and manage secrets for users. It is a publicly exposed service that handles the uploading and storing of secrets, and every time you upload a secret to your vault, the secrets manager establishes a reference to it, so it can be shared or read without revealing its contents. Secrets are bound to an environment within an organization, and within each environment they are further segregated into secret groups. Supported secret types include Keystore, Truststore, Certificate, Certificate Pinset, Shared Secret (Username-Password, Symmetric Key, S3 Credential, Blob), TLS Context (Mule and Flex Gateway), and CRL Distributor Configuration.

    Secrets Manager API enables secure secret storage and management bound to environments within organizations. Secrets are organized hierarchically: Organization > Environment > Secret Group. A maximum of 25 secret groups per environment per business group are allowed, and each secret group can contain a maximum of 350 secrets. The actual secrets can be consumed only by authorized platform services on your behalf; you can only read metadata.
  version: 1.6.x
  contact:
    name: MuleSoft
    url: https://www.mulesoft.com
servers:
  - url: https://anypoint.mulesoft.com/secrets-manager/api/v1
    description: Anypoint Platform
security:
  - bearerAuth: []
paths:
  /organizations/{orgId}/environments/{envId}/secretGroups:
    get:
      summary: List secret groups
      description: Lists all secret groups for a given organization and environment, including the name and ID of each group.
      operationId: get__organizations_orgId_environments_envId_secretGroups
      tags:
        - Security
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
        - name: envId
          in: path
          required: true
          description: Environment ID
          schema:
            type: string
      responses:
        '200':
          description: List of secret groups with name, ID, and metadata
    post:
      summary: Create a secret group
      description: Creates a new secret group with the specified name for organizing secrets within an environment.
      operationId: post__organizations_orgId_environments_envId_secretGroups
      tags:
        - Security
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
        - name: envId
          in: path
          required: true
          description: Environment ID
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                downloadable:
                  type: string
              required:
                - name
                - downloadable
            example:
              name: my-secret-group
      responses:
        '201':
          description: Secret group created successfully, returns group ID and metadata
  /organizations/{orgId}/environments/{envId}/secretGroups/{secretGroupId}:
    get:
      summary: Get secret group details
      description: Retrieves the details for a specific secret group.
      operationId: get__organizations_orgId_environments_envId_secretGroups_secretGroupId_
      tags:
        - Security
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
        - name: envId
          in: path
          required: true
          description: Environment ID
          schema:
            type: string
        - name: secretGroupId
          in: path
          required: true
          description: Secret group ID
          schema:
            type: string
      responses:
        '200':
          description: Secret group details including name, ID, and downloadable status
    delete:
      summary: Delete a secret group
      description: Deletes the specified secret group and all secrets contained within it.
      operationId: delete__organizations_orgId_environments_envId_secretGroups_secretGroupId_
      tags:
        - Security
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
        - name: envId
          in: path
          required: true
          description: Environment ID
          schema:
            type: string
        - name: secretGroupId
          in: path
          required: true
          description: Secret group ID
          schema:
            type: string
      responses:
        '204':
          description: Secret group deleted successfully
    patch:
      summary: Update a secret group
      description: Modifies the name or downloadable status of an existing secret group.
      operationId: patch__organizations_orgId_environments_envId_secretGroups_secretGroupId_
      tags:
        - Security
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
        - name: envId
          in: path
          required: true
          description: Environment ID
          schema:
            type: string
        - name: secretGroupId
          in: path
          required: true
          description: Secret group ID
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                downloadable:
                  type: string
              required:
                - name
                - downloadable
      responses:
        '200':
          description: Secret group updated successfully
  /organizations/{orgId}/environments/{envId}/secretGroups/{secretGroupId}/lock:
    put:
      summary: Acquire lock on secret group
      description: Acquires a lock on a secret group. Required before making any modifications to secrets within the group.
      operationId: put__organizations_orgId_environments_envId_secretGroups_secretGroupId_lock
      tags:
        - Security
      security:
