          description: List of shared secrets with metadata (sensitive values excluded)
    post:
      summary: Create a shared secret
      description: 'Creates a new shared secret in a secret group. Supported types: UsernamePassword, SymmetricKey, S3Credential, Blob.'
      operationId: post__organizations_orgId_environments_envId_secretGroups_secretGroupId_sharedSecrets
      tags:
        - Security
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
        - name: envId
          in: path
          required: true
          description: Environment ID
          schema:
            type: string
        - name: secretGroupId
          in: path
          required: true
          description: Secret group ID
          schema:
            type: string
      requestBody:
        required: true
        description: ''
        content:
          application/json:
            schema:
              name:
                type: string
                description: Name of the secret
              type:
                type: string
                enum:
                  - UsernamePassword
                  - SymmetricKey
                  - S3Credential
                  - Blob
                description: Type of shared secret
              username:
                type: string
                description: Username (for UsernamePassword type)
              password:
                type: string
                description: Password (for UsernamePassword type)
              expirationDate:
                type: string
                format: date
                description: Optional expiration date (YYYY-MM-DD)
            example:
              name: my-shared-secret
              type: UsernamePassword
              username: testuser
              password: testpassword
              expirationDate: '2025-12-31'
      responses:
        '201':
          description: Shared secret created successfully
