openapi: 3.1.1
info:
  title: Anypoint MQ Admin API
  description: |-
    The Anypoint MQ Admin API provides API access to Anypoint MQ administrative functionality. This API allows you to browse queues and message exchanges, create queues and message exchanges, manage bindings for message exchanges, manage cross-region fallback configuration for standard queues, and configure message routing rules on exchange-to-queue bindings.
  version: v1
servers:
  - url: https://anypoint.mulesoft.com/mq/admin/api

security:
  - oauth2: []
  - {}

paths:
  /v1/organizations/{organizationId}:
    delete:
      operationId: deleteOrganization
      summary: Delete organization
      description: >
        Delete organization. If you are using connected app, "Administer destinations" and "Manage clients" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
      responses:
        '204':
          description: The resource has been correctly removed.
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}:
    delete:
      operationId: deleteEnvironment
      summary: Delete environment
      description: >
        Delete environment. If you are using connected app, "Administer destinations" and "Manage clients" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
      responses:
        '204':
          description: The resource has been correctly removed.
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/clients:
    get:
      operationId: listClients
      summary: List messaging clients
      description: >
        Gets the list of messaging clients. If you are using connected app, "View clients" or "Manage clients" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: List of messaging clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
              examples:
                default:
                  value:
                    - clientId: a1b2c3d4e5f6
                      name: my-mq-client
                      createdAt: '2024-06-01T10:00:00.000Z'
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    put:
      operationId: createClient
      summary: Create a messaging client
      description: >
        Create a messaging client. If you are using connected app, "Manage clients" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
            examples:
              default:
                value:
                  name: my-new-client
      responses:
        '200':
          description: Client created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/clients/{clientId}:
    post:
      operationId: regenerateClientSecret
      summary: Regenerate client secret
      description: >
        Regenerates the client secret. If you are using connected app, "Manage clients" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/clientId'
      responses:
        '200':
          description: Client secret regenerated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    delete:
      operationId: deleteClient
      summary: Delete a messaging client
      description: >
        Deletes a client. If you are using connected app, "Manage clients" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/clientId'
      responses:
        '200':
          description: Client deleted successfully.
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions:
    get:
      operationId: listRegions
      summary: List available regions
      description: >
        Obtains the valid regions where the service is deployed. If you are using connected app, no specific scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: List of available regions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
              examples:
                default:
                  value:
                    - regionId: us-east-1
                      name: US East (N. Virginia)
                    - regionId: eu-west-1
                      name: EU West (Ireland)

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}:
    get:
      operationId: getRegion
      summary: Get a region
      description: >
        Obtains the region entity. If you are using connected app, no specific scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
      responses:
        '200':
          description: Region details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
              examples:
                default:
                  value:
                    regionId: us-east-1
                    name: US East (N. Virginia)

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/destinations:
    get:
      operationId: listDestinations
      summary: List all destinations
      description: >
        Retrieve all the destinations. If you are using connected app, "View destinations" or "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: startsWith
          in: query
          required: false
          schema:
            type: string
          description: Search the field from the left using the passed string.
        - name: inclusion
          in: query
          required: false
          schema:
            type: string
            enum: [all, minimal]
            default: all
          description: Defines what to fetch.
        - name: destinationType
          in: query
          required: false
          schema:
            type: string
            enum: [all, queue, exchange]
            default: all
          description: Defines what to fetch.
      responses:
        '200':
          description: List of destinations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
              examples:
                default:
                  value:
                    - destinationId: my-queue
                      type: queue
                      exchangeId: ''
                    - destinationId: my-exchange
                      type: exchange
                      exchangeId: ''
        '204':
          description: There are no elements to return.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/destinations/queues/{queueId}:
    get:
      operationId: getQueue
      summary: Get a queue
      description: >
        Get the queue with queueId = {queueId}. If you are using connected app, "View destinations" or "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/queueId'
      responses:
        '200':
          description: Queue details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
              examples:
                default:
                  value:
                    queueId: my-queue
                    defaultTtl: 604800000
                    defaultLockTtl: 120000
                    encrypted: true
                    deadLetterQueueId: my-dlq
                    maxDeliveries: 10
                    fifo: false
        '404':
          description: The requested resource is not found on this broker.
          content:
            application/json:
              examples:
                default:
                  value:
                    message: queue not found
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    put:
      operationId: createOrReplaceQueue
      summary: Create or replace a queue
      description: >
        Add new queue to the broker. This is an idempotent API. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/queueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Queue'
            examples:
              default:
                value:
                  queueId: my-queue
                  defaultTtl: 604800000
                  defaultLockTtl: 120000
                  encrypted: true
                  maxDeliveries: 10
                  fifo: false
      responses:
        '200':
          description: Queue created or replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    patch:
      operationId: updateQueue
      summary: Update a queue
      description: >
        Updates fields specified; if "maxDeliveries" or "deadLetterQueueId" are not provided the dead letter queue configuration will be removed.
        If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/queueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Queue'
            examples:
              default:
                value:
                  defaultTtl: 604800000
                  maxDeliveries: 5
      responses:
        '200':
          description: Queue updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    delete:
      operationId: deleteQueue
      summary: Delete a queue
      description: >
        Delete queue from the broker. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/queueId'
      responses:
        '204':
          description: The resource has been correctly removed.
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/destinations/queues/{queueId}/messages:
    delete:
      operationId: purgeQueue
      summary: Purge queue messages
      description: >
        Deletes the messages contained in the queue (effectively purging it). The deleted messages cannot be retrieved any more.
        Messages present in the queue prior to this call are deleted; messages sent after this call may also be deleted.
        If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/queueId'
      responses:
        '204':
          description: The resource has been correctly removed.
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/destinations/queues/{queueId}/fallback:
    put:
      operationId: setQueueFallbackConfiguration
      summary: Set queue fallback configuration
      description: >
        Enables or disables cross-region failover configuration for a queue. This configuration is used to evaluate if messages
        published to or consumed from a queue using Anypoint MQ Connector temporarily redirect to a fallback queue in a fallback
        region when the primary region is unavailable. If you are using a connected app, "Administer destinations" scope is required.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/queueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueFallbackConfiguration'
            examples:
              enable:
                summary: Enable fallback
                value:
                  enabled: true
                  fallbackRegionId: eu-west-1
              disable:
                summary: Disable fallback
                value:
                  enabled: false
      responses:
        '201':
          description: Fallback configuration created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueFallbackConfigurationResponse'
              examples:
                default:
                  value:
                    enabled: true
                    fallbackRegionId: eu-west-1
                    queueId: my-queue
        '400':
          description: Invalid payload or feature not supported for a given destination type.
        '401':
          description: Invalid authentication token.
        '403':
          description: Not enough permissions to enable or disable fallback configuration for a queue.
        '404':
          description: Environment or queue specified in the request URI doesn't exist.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/destinations/exchanges/{exchangeId}:
    get:
      operationId: getExchange
      summary: Get an exchange
      description: >
        Get the exchange with exchangeId = {exchangeId}. If you are using connected app, "View destinations" or "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
      responses:
        '200':
          description: Exchange details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
              examples:
                default:
                  value:
                    exchangeId: my-exchange
                    encrypted: true
        '404':
          description: The requested resource is not found on this broker.
          content:
            application/json:
              examples:
                default:
                  value:
                    message: exchange not found
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    put:
      operationId: createOrReplaceExchange
      summary: Create or replace an exchange
      description: >
        Add new exchange to the broker. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Exchange'
            examples:
              default:
                value:
                  exchangeId: my-exchange
                  encrypted: true
      responses:
        '200':
          description: Exchange created or replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    patch:
      operationId: updateExchange
      summary: Update an exchange
      description: >
        Modifies the exchange of the broker. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Exchange'
            examples:
              default:
                value:
                  encrypted: false
      responses:
        '200':
          description: Exchange updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    delete:
      operationId: deleteExchange
      summary: Delete an exchange
      description: >
        Delete the exchange. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
      responses:
        '204':
          description: The resource has been correctly removed.
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/bindings/exchanges/{exchangeId}:
    get:
      operationId: listExchangeBindings
      summary: List bindings for an exchange
      description: >
        Gathers all the queues bound to exchange. If you are using connected app, "View destinations" or "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: startsWith
          in: query
          required: false
          schema:
            type: string
          description: Search the field from the left using the passed string.
        - name: inclusion
          in: query
          required: false
          schema:
            type: string
            enum: [all, minimal]
            default: minimal
          description: Defines what to fetch. inclusion=all returns details like routing rules defined on the binding.
      responses:
        '200':
          description: List of bindings for the exchange.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Binding'
              examples:
                default:
                  value:
                    - exchangeId: my-exchange
                      queueId: my-queue-1
                    - exchangeId: my-exchange
                      queueId: my-queue-2
        '204':
          description: There are no elements to return.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/bindings/exchanges/{exchangeId}/queues/{queueId}:
    get:
      operationId: getExchangeQueueBinding
      summary: Get a specific binding
      description: >
        Gathers the existence of a specific binding. If you are using connected app, "View destinations" or "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
        - $ref: '#/components/parameters/queueId'
        - name: inclusion
          in: query
          required: false
          schema:
            type: string
            enum: [all, minimal]
            default: minimal
          description: Defines what to fetch. inclusion=all returns details like routing rules defined on the binding.
      responses:
        '200':
          description: Binding details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
              examples:
                default:
                  value:
                    exchangeId: my-exchange
                    queueId: my-queue
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    put:
      operationId: createExchangeQueueBinding
      summary: Create a binding
      description: >
        Creates a binding between a message exchange and a queue. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
        - $ref: '#/components/parameters/queueId'
      responses:
        '200':
          description: Binding created.
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.
    delete:
      operationId: deleteExchangeQueueBinding
      summary: Delete a binding
      description: >
        Deletes this binding. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
        - $ref: '#/components/parameters/queueId'
      responses:
        '204':
          description: The resource has been correctly removed.
        '404':
          description: The requested resource is not found on this broker.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/bindings/exchanges/{exchangeId}/queues/{queueId}/rules/routing:
    put:
      operationId: createRoutingRules
      summary: Create routing rules on a binding
      description: >
        Creates a routing rule on a binding between a message exchange and a queue. This rule is used to evaluate if a message
        published to an exchange should be forwarded to a specific queue. This will override existing routing rules on the
        binding with the new rules specified in this request. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
        - $ref: '#/components/parameters/queueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingRules'
            examples:
              default:
                value:
                  rules:
                    - propertyName: messageType
                      propertyType: STRING
                      matcherType: EQUALS
                      value: order
      responses:
        '201':
          description: Routing rules created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRulesResponse'
              examples:
                default:
                  value:
                    rules:
                      - propertyName: messageType
                        propertyType: STRING
                        matcherType: EQUALS
                        value: order
        '400':
          description: Invalid payload.
        '401':
          description: Invalid authentication token.
        '403':
          description: Not enough permissions to create a routing rule.
        '404':
          description: Environment, exchange, queue, or binding specified in the request URI doesn't exist.
    delete:
      operationId: deleteRoutingRules
      summary: Delete routing rules on a binding
      description: >
        Deletes routing rules on a binding between a message exchange and queue. If you are using connected app, "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/exchangeId'
        - $ref: '#/components/parameters/queueId'
      responses:
        '204':
          description: Successfully deleted or routing rules don't exist.
        '401':
          description: Invalid authentication token.
        '403':
          description: Not enough permissions to delete routing rules.
        '404':
          description: Exchange, queue, or binding specified in the request URI doesn't exist.

  /v1/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/bindings/queues/{queueId}:
    get:
      operationId: listQueueBindings
      summary: List bindings for a queue
      description: >
        Gathers all the exchanges bound to the queue. If you are using connected app, "View destinations" or "Administer destinations" scope is needed.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/queueId'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: startsWith
          in: query
          required: false
          schema:
            type: string
          description: Search the field from the left using the passed string.
        - name: inclusion
          in: query
          required: false
          schema:
            type: string
            enum: [all, minimal]
            default: minimal
          description: Defines what to fetch. inclusion=all returns details like routing rules defined on the binding.
      responses:
        '200':
          description: List of bindings for the queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Binding'
              examples:
                default:
                  value:
                    - exchangeId: my-exchange-1
                      queueId: my-queue
                    - exchangeId: my-exchange-2
                      queueId: my-queue
        '204':
          description: There are no elements to return.
        '501':
          description: This request is not implemented by this broker or an unexpected error occurred.

  /v1/authorize:
    post:
      operationId: authorize
      summary: Obtain an access token
      description: >
        Obtains an access token using client credentials of the OAuth grant type. This API is not supported with connected apps.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - client_secret
                - grant_type
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                grant_type:
                  type: string
                  enum:
                    - client_credentials
            examples:
              default:
                value:
                  client_id: a1b2c3d4e5f6
                  client_secret: sEcReTvAlUe
                  grant_type: client_credentials
      responses:
        '200':
          description: Access token granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
              examples:
                default:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    token_type: bearer
                    simple_client:
                      envId: env-123
                      orgId: org-456
        '401':
          description: Invalid client credentials.

  /v2/organizations/{organizationId}/environments/{environmentId}/regions/{regionId}/destinations/queues/{queueId}:
    patch:
      operationId: updateQueueV2
      summary: Update a queue (v2)
      description: >
        Updates only the fields specified, "maxDeliveries" and "deadLetterQueueId" must be consistent.
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/environmentId'
        - $ref: '#/components/parameters/regionId'
        - $ref: '#/components/parameters/queueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Queue'
            examples:
              default:
                value:
                  defaultTtl: 604800000
                  maxDeliveries: 5
      responses:
        '200':
          description: Queue updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'

components:
  parameters:
    organizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
      examples:
        default:
          value: 8a2a82a0-b8c1-4457-b385-4dc1c7b8900e
    environmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
      examples:
        default:
          value: c9e28061-60f0-4e54-a048-44f053a8a993
    regionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
      examples:
        default:
          value: us-east-1
    clientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
      examples:
        default:
          value: a1b2c3d4e5f6
    queueId:
      name: queueId
      in: path
      required: true
      schema:
        type: string
      examples:
        default:
          value: my-queue
    exchangeId:
      name: exchangeId
      in: path
      required: true
      schema:
        type: string
      examples:
        default:
          value: my-exchange
    offset:
      name: offset
      in: query
      required: false
      description: Skip over a number of elements by specifying an offset value for the query.
      schema:
        type: integer
        default: 0
        examples:
          - 20
    limit:
      name: limit
      in: query
      required: false
      description: Limit the number of elements in the response.
      schema:
        type: integer
        default: 20
        examples:
          - 80

  schemas:
    Client:
      type: object
      properties:
        clientId:
          type: string
        name:
          type: string
        createdAt:
          type: string
    ClientInput:
      type: object
      properties:
        name:
          type: string
    Region:
      type: object
      properties:
        regionId:
          type: string
        name:
          type: string
    Destination:
      type: object
      properties:
        destinationId:
          type: string
        type:
          type: string
          enum:
            - queue
            - exchange
        exchangeId:
          type: string
    Queue:
      type: object
      properties:
        queueId:
          type: string
        defaultTtl:
          type: integer
          description: Default time-to-live in milliseconds.
        defaultLockTtl:
          type: integer
          description: Default lock time-to-live in milliseconds.
        encrypted:
          type: boolean
        deadLetterQueueId:
          type: string
        maxDeliveries:
          type: integer
        fifo:
          type: boolean
    Exchange:
      type: object
      properties:
        exchangeId:
          type: string
        encrypted:
          type: boolean
    Binding:
      type: object
      properties:
        exchangeId:
          type: string
        queueId:
          type: string
    QueueFallbackConfiguration:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        fallbackRegionId:
          type: string
    QueueFallbackConfigurationResponse:
      type: object
      properties:
        enabled:
          type: boolean
        fallbackRegionId:
          type: string
        queueId:
          type: string
    RoutingRules:
      type: object
      required:
        - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRule'
    RoutingRule:
      type: object
      required:
        - propertyName
        - propertyType
        - matcherType
        - value
      properties:
        propertyName:
          type: string
        propertyType:
          type: string
          enum:
            - STRING
        matcherType:
          type: string
          enum:
            - EQUALS
        value:
          type: string
    RoutingRulesResponse:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRule'
    AuthToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        simple_client:
          type: object
          properties:
            envId:
              type: string
            orgId:
              type: string

  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/authorize
          scopes: {}
